---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - kube.wailord.jsck.network
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - 10.244.0.0/16
serviceSubnets:
  - 10.96.0.0/12
---
# CNI is none (Cilium). The v1.14 generator emits a KubeFlannelCNIConfig
# default — omitting it is NOT enough, it must be explicitly deleted.
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# Pinned off: v1.14 defaults workloadIsolation to true (sandboxd PID/mount
# namespaces for containerd/kubelet/pods). Keep current behavior for the
# upgrade; flip deliberately as a follow-up once Longhorn v2 is verified.
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: false

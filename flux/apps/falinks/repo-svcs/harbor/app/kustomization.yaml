apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: harbor-values
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled

resources:
  - resources/helm-release.yaml
  - resources/helm-repo.yaml
  - resources/postgres.yaml
  - resources/postgres-db-secret.yaml
  - resources/valkey-helm-release.yaml
  - resources/valkey-helm-repo.yaml
  - resources/harbor-inital-password.yaml

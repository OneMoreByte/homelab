apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor-valkey
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey
      version:  0.11.0
      sourceRef:
        kind: HelmRepository
        name: harbor-valkey
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values: {}

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  interval: 1h
  chart:
    spec:
      chart: harbor
      version:  1.19.2
      sourceRef:
        kind: HelmRepository
        name: harbor-repo
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    enableMigrateHelmHook: true

    ipFamily:
      ipv6:
        enabled: false

    expose:
      type: route
      route:
        parentRefs:
          - name: "internal"
            namespace: "gateway-svcs"
            sectionName: websecure-gw
        hosts:
          - "harbor.jsck.network"

    externalURL: https://harbor.jsck.network

    database:
      type: external
      external:
        host: "harbor-pg-cluster-rw"
        username: "harbor"
        existingSecret: harbor-db-secret

    redis:
      type: external
      external:
        addr: "harbor-valkey:6379"

    persistence:
      enabled: true
      imageChartStorage:
        type: filesystem

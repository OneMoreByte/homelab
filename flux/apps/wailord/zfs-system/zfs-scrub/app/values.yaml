controllers:
  zfs-scrub-store:
    type: cronjob
    cronjob:
      schedule: "0 0 1,15 * *"
      successfulJobsHistory: 1
      failedJobsHistory: 1
      concurrencyPolicy: Forbid
      timeZone: UTC
      backoffLimit: 0
    containers:
      app:
        image:
          repository: ghcr.io/onemorebyte/talos-shell
          tag: 0.4.1
        command: ["zpool", "scrub", "-w", "store"]
        securityContext:
          privileged: true
  zfs-scrub-speed-store:
    type: cronjob
    cronjob:
      schedule: "0 0 1,15 * *"
      successfulJobsHistory: 1
      failedJobsHistory: 1
      concurrencyPolicy: Forbid
      timeZone: UTC
      backoffLimit: 0
    containers:
      app:
        image:
          repository: ghcr.io/onemorebyte/talos-shell
          tag: 0.4.1
        command: ["zpool", "scrub", "-w", "fast-store"]
        securityContext:
          privileged: true
persistence:
  dev:
    type: hostPath
    hostPath: /dev/zfs
    globalMounts:
      - path: /dev/zfs

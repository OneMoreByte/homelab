apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eck-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: eck-operator
      version: 3.5.0
      sourceRef:
        kind: HelmRepository
        name: elastic-repo
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 2
  values: {}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  timeout: 30m
  chartRef:
    kind: OCIRepository
    name: immich
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0
            env:
              REDIS_HOSTNAME: "immich-valkey"
              UID: 11337
              PID: 11337
              TEST: "me"
              DB_HOSTNAME: '{{ .Release.Name }}-pg-cluster-rw'
              DB_DATABASE_NAME: immich
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-secret
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-secret
                    key: password
        initContainers:
          wait-for-zfs:
            image:
              repository: busybox
              tag: latest
            command:
              - /bin/sh
              - -c
              - |
                if [ ! -f /var/mnt/store/mount-state/.mounted ]; then
                  echo "Waiting for ZFS mount..."
                  sleep 30
                  exit 1
                fi
                
                if [ ! -f /var/mnt/fast-store/mount-state/.mounted ]; then
                  echo "Waiting for ZFS mount..."
                  sleep 30
                  exit 1
                fi

    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - bulk-datastore
      securityContext:
        runAsUser: 11337
        runAsGroup: 11337
        fsGroup: 11337

    persistence:
      data:
        enabled: false
        type: emptyDir

      library:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/fast-store/k8s-hostpath/immich
        advancedMounts:
          main:
            main:
              - path: /data
      syncthing-library:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/store/backups/syncthing/Pictures

      mountstate:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/store/mount-state

      mountstate-fast:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/fast-store/mount-state

    immich:
      metrics:
        enabled: true

      configuration: {}
      configurationKind: Secret
      existingConfiguration: immich-config

      persistence:
        library:
          existingClaim: "not-used"

    server:
      route:
        main:
          kind: HTTPRoute
          annotations:
            external-dns.alpha.kubernetes.io/target: "home.jackhil.de"
          parentRefs:
            - name: "external"
              namespace: "gateway-svcs"
              sectionName: websecure-gw
          hostnames:
            - "photos.jackhil.de"
          rules:
            - name: "default"
              backendRefs:
                - name: immich-server
                  port: 2283
              matches:
                - path:
                    value: /
                    type: PathPrefix

      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.1.0

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.1.0-openvino
              securityContext:
                privileged: true
                runAsUser: 0
                runAsGroup: 0
                fsGroup: 0
              env:
                TRANSFORMERS_CACHE: /cache
                HF_XET_CACHE: /cache/huggingface-xet
                MPLCONFIGDIR: /cache/matplotlib-config

      persistence:
        cache:
          enabled: true
          size: 32Gi
          type: persistentVolumeClaim
          accessMode: ReadWriteMany

---

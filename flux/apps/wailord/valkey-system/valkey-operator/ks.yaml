---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app valkey
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app


  interval: 1h
  path: ./flux/apps/wailord/valkey-system/valkey-operator/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: valkey-operator
  timeout: 5m
  wait: false
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey-operator
      version:  0.4.1
      sourceRef:
        kind: HelmRepository
        name: valkey-operator
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values: {}
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: mariadb-operator-values
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled

resources:
  - resources/crds-helm-release.yaml
  - resources/helm-release.yaml
  - resources/helm-repo.yaml

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-vanilla
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: minecraft-vanilla
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: minecraft-vanilla-values

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: prowlarr
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:

    global:
      alwaysAppendIdentifierToResourceName: true
    controllers:
      main:
        enabled: true
        strategy: Recreate
        containers:
          main:
            env:
              TZ: America/Chicago
              PUID: 11337
              PGID: 11337
            image:
              repository: ghcr.io/hotio/prowlarr
              tag: release-2.5.2.5491
              pullPolicy: IfNotPresent
        initContainers:
          configure-postgres:
            image:
              repository: ghcr.io/onemorebyte/arr-pg-configure
              tag: 0.1.0
            workingDir: "/config"
            env:
              POSTGRESHOST: "prowlarr-pg-cluster-rw"
              POSTGRESUSER:
                valueFrom:
                  secretKeyRef:
                    name: prowlarr-db-secret
                    key: username
              POSTGRESPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: prowlarr-db-secret
                    key: password
    defaultPodOptions:
      securityContext:
        fsGroup: 11337
    service:
      main:
        controller: main
        ports:
          http:
            port: 9696

    route:
      main:
        kind: HTTPRoute
        parentRefs:
          - name: "internal"
            namespace: "gateway-svcs"
            sectionName: websecure-gw
        hostnames:
          - "prowlarr.jsck.network"
        rules:
          - name: "default"
            backendRefs:
              - name: prowlarr-main
                port: 9696
            matches:
              - path:
                  value: /
                  type: PathPrefix

    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        size: 16Gi
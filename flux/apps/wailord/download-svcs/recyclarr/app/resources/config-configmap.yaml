kind: ConfigMap
apiVersion: v1
metadata:
  name: recyclarr-config
data:
  recyclarr.yml: |-
    sonarr:
      sonarr:
        base_url: !secret sonarr_base_url
        api_key: !secret sonarr_api_key
  
        media_naming:
          series: jellyfin-tvdb
          season: default
          episodes:
            rename: true
            standard: default
            daily: default
            anime: default

        quality_definition:
          type: series

        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            reset_unmatched_scores:
              enabled: true

        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
              select:
                - 9b64dff695c2115facf1b6ea59c9bd07  # x265 (no HDR/DV)
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
            - trash_id: d920fd959d220306888f40b6f38e1578  # [Optional] Season Packs

      sonarr-anime:
        base_url: !secret sonarr_anime_base_url
        api_key: !secret sonarr_anime_api_key

        media_naming:
          series: jellyfin-tvdb
          season: default
          episodes:
            rename: true
            standard: default
            daily: default
            anime: default

        quality_definition:
          type: anime

        quality_profiles:
          - trash_id: &anime_remux 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
            reset_unmatched_scores:
              enabled: true

        custom_formats:
          - trash_id: 418f50b10f1907201b6cfdf881f467b7  # Anime Dual Audio
            assign_scores_to:
              - id: *anime_remux
                score: 2000 
          - trash_id: b2550eb333d27b75833e25b8c2557b38 # 10bit
            assign_scores_to:
              - id: *anime_remux
                score: 30

    radarr:
      radarr:
        base_url: !secret radarr_base_url
        api_key: !secret radarr_api_key

        media_naming:
          folder: jellyfin-imdb
          movie:
            rename: true
            standard: jellyfin-tmdb

        quality_definition:
          type: movie

        quality_profiles:
          - trash_id: 9ca12ea80aa55ef916e3751f4b874151  # Remux + WEB 1080p
            reset_unmatched_scores:
              enabled: true

        custom_format_groups:
          add:
            - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
              select:
                - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
              select:
                - trash_id: bc3c13e52f2971319bc1748ffa3d1078  # [Optional] Accessibility
                  select:
                   - 127bdbadcf3e4463a8c707759fbaad75  # WiTH AD
                   - 09c60ba54fadb511c6986a7edec4da4b  # WiTH ASL
                   - 41e4baea7b10ddefc6609d52f742dacd  # WiTH BASL
                   - e205c5ba6be76b472903f4aec97fdb4b  # WiTH BSL

            - trash_id: f4f1474b963b24cf983455743aa9906c  # [Optional] Movie Versions
              select:
                - e0c07d59beb37348e975a930d5e50319  # Criterion Collection
                - eecf3a857724171f968a66cb5719e152  # IMAX
                - 9f6cbff8cfe4ebbc1bde14c7b7bec0de  # IMAX Enhanced
                - 9d27d9d2181838f76dee150882bdc58c  # Masters of Cinema
                - 09d9dd29a0fc958f9796e65c2a8864b4  # Open Matte
                - db9b4c4b53d312a3ca5f1378f6440fc9  # Vinegar Syndrome

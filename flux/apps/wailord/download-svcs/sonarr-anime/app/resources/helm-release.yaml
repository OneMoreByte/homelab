apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr-anime
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sonarr-anime
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      alwaysAppendIdentifierToResourceName: true
    controllers:
      main:
        replicas: 1
        enabled: true
        strategy: Recreate
        containers:
          main:
            env:
              TZ: America/Chicago
              PUID: 11337
              PGID: 11337
            image:
              repository: ghcr.io/hotio/sonarr
              tag: release-4.0.19.2979
              pullPolicy: IfNotPresent
        initContainers:
          wait-for-zfs:
            image:
              repository: busybox
              tag: latest
            command:
              - /bin/sh
              - -c
              - |
                if [ ! -f /var/mnt/store/mount-state/.mounted ]; then
                  echo "Waiting for ZFS mount..."
                  sleep 30
                  exit 1
                fi

          configure-postgres:
            image:
              repository: ghcr.io/onemorebyte/arr-pg-configure
              tag: 0.1.0
            workingDir: "/config"
            env:
              POSTGRESHOST: "sonarr-anime-pg-cluster-rw"
              POSTGRESUSER:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-anime-db-secret
                    key: username
              POSTGRESPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-anime-db-secret
                    key: password

    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - bulk-datastore
      securityContext:
        fsGroup: 11337
    service:
      main:
        controller: main
        ports:
          http:
            port: 8989
    route:
      main:
        kind: HTTPRoute
        parentRefs:
          - name: "internal"
            namespace: "gateway-svcs"
            sectionName: websecure-gw
        hostnames:
          - "sonarr-anime.jsck.network"
        rules:
          - name: "default"
            backendRefs:
              - name: sonarr-anime-main
                port: 8989
            matches:
              - path:
                  value: /
                  type: PathPrefix

    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        size: 16Gi
      media:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/store/plex-files/
      torrent:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/store/torrent/
      mountstate:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/store/mount-state
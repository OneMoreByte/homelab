coder:
  env:
    - name: "CODER_ACCESS_URL"
      value: "https://coder.jackhil.de"
  serviceAccount:
    workspacePerms: false
    enableDeployments: false
    workspaceNamespaces:
      - name: dev-spaces
        workspacePerms: true
        enableDeployments: true

  httproute:
    enable: true
    annotations:
      external-dns.kubernetes.io/target: "home.jackhil.de"
    parentRefs:
      - name: "external"
        namespace: "gateway-svcs"
        sectionName: websecure-gw
    host: "coder.jackhil.de"
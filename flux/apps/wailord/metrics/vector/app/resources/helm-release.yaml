apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: vector
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: vector-values

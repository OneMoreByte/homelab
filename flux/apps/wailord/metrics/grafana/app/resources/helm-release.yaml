apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: grafana
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 2
  values:
    env:
      - name: ES_USERNAME
        valueFrom:
          secretKeyRef:
            name: "grafana-filerealm-secret"
            key: "username"
      - name: ES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: "grafana-filerealm-secret"
            key: "password"

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://prometheus-kube-prometheus-prometheus.metrics.svc.cluster.local:9090
            access: proxy
            isDefault: true

          - name: k8s-logs
            type: elasticsearch
            access: proxy
            url: https://log-cluster-es-http:9200
            basicAuth: true
            isDefault: false
            basicAuthUser: $ES_USERNAME
            secureJsonData:
              basicAuthPassword: $ES_PASSWORD
            jsonData:
              index: logs-k8s-logs-default
              logLevelField: ''
              logMessageField: log
              maxConcurrentShardRequests: 5
              timeField: '@timestamp'
              tlsSkipVerify: true
          - name: k8s-audit
            type: elasticsearch
            access: proxy
            url: https://log-cluster-es-http:9200
            basicAuth: true
            isDefault: false
            basicAuthUser: $ES_USERNAME
            secureJsonData:
              basicAuthPassword: $ES_PASSWORD
            jsonData:
              index: logs-k8s-audit-default
              logLevelField: level
              logMessageField: message
              maxConcurrentShardRequests: 5
              timeField: '@timestamp'
              tlsSkipVerify: true

          - name: talos-kernel
            type: elasticsearch
            access: proxy
            url: https://log-cluster-es-http:9200
            basicAuth: true
            isDefault: false
            basicAuthUser: $ES_USERNAME
            secureJsonData:
              basicAuthPassword: $ES_PASSWORD
            jsonData:
              index: logs-talos-kernel-default
              logLevelField: level
              logMessageField: message
              maxConcurrentShardRequests: 5
              timeField: '@timestamp'
              tlsSkipVerify: true

          - name: talos-service
            type: elasticsearch
            access: proxy
            url: https://log-cluster-es-http:9200
            basicAuth: true
            isDefault: false
            basicAuthUser: $ES_USERNAME
            secureJsonData:
              basicAuthPassword: $ES_PASSWORD
            jsonData:
              index: logs-talos-service-default
              logLevelField: level
              logMessageField: message
              maxConcurrentShardRequests: 5
              timeField: '@timestamp'
            tlsSkipVerify: true

    persistence:
      enabled: true
    serviceMonitor:
      enabled: true
    ingress:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.tls: 'true'
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      labels: {}
      path: /
      hosts:
        - grafana.jackhil.de
      tls:
        - hosts:
            - grafana.jackhil.de
          secretName: jackhil.de-cert
    envFromSecrets:
      - name: grafana-client-secret
        optional: true
    grafana.ini:
      server:
        domain: grafana.jackhil.de
        root_url: https://grafana.jackhil.de
      auth:
        oauth_allow_insecure_email_lookup: false
        allow_assign_grafana_admin: true
      auth.generic_oauth:
        enabled: true
        oauth_name: Login with The Science Team
        scopes: openid profile email groups roles
        allow_sign_up: true
        client_id: Q031o80DKMWG9lLErskBJG5ByC4a4v2kerbn2IXA
        auth_url: https://auth.thescience.team/application/o/authorize/
        token_url: https://auth.thescience.team/application/o/token/
        api_url: https://auth.thescience.team/application/o/userinfo/
        role_attribute_path: contains(groups[*], 'grafana-jscknet-admin') && 'Admin' || contains(groups[*], 'grafana-jscknet-editor') && 'Editor' || 'Viewer'

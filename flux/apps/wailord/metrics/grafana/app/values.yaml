env:
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: true

dashboards:
  default:
    hubble-dashboard:
      url: https://raw.githubusercontent.com/cilium/cilium/refs/heads/main/install/kubernetes/cilium/files/hubble/dashboards/hubble-dashboard.json
    hubble-dns-namespace:
      url: https://raw.githubusercontent.com/cilium/cilium/refs/heads/main/install/kubernetes/cilium/files/hubble/dashboards/hubble-dns-namespace.json
    hubble-l7:
      url: https://raw.githubusercontent.com/cilium/cilium/refs/heads/main/install/kubernetes/cilium/files/hubble/dashboards/hubble-l7-http-metrics-by-workload.json
    hubble-network-overview:
      url: https://raw.githubusercontent.com/cilium/cilium/refs/heads/main/install/kubernetes/cilium/files/hubble/dashboards/hubble-network-overview-namespace.json
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.metrics.svc.cluster.local:9090
        access: proxy
        isDefault: true

persistence:
  enabled: true
serviceMonitor:
  enabled: true
route:
  main:
    enabled: true
    kind: HTTPRoute
    annotations:
      external-dns.kubernetes.io/target: "home.jackhil.de"
    parentRefs:
      - name: "external"
        namespace: "gateway-svcs"
        sectionName: websecure-gw
    hostnames:
      - "grafana.jackhil.de"
envFromSecrets:
  - name: grafana-client-secret
    optional: true
grafana.ini:
  server:
    domain: grafana.jackhil.de
    root_url: https://grafana.jackhil.de
  auth:
    oauth_allow_insecure_email_lookup: false
    allow_assign_grafana_admin: true
  auth.generic_oauth:
    enabled: true
    oauth_name: Login with The Science Team
    scopes: openid profile email groups roles
    allow_sign_up: true
    client_id: Q031o80DKMWG9lLErskBJG5ByC4a4v2kerbn2IXA
    auth_url: https://auth.thescience.team/application/o/authorize/
    token_url: https://auth.thescience.team/application/o/token/
    api_url: https://auth.thescience.team/application/o/userinfo/
    role_attribute_path: contains(groups[*], 'infra-jscknet-admin') && 'Admin' || contains(groups[*], 'infra-jscknet-editor') && 'Editor' || 'Viewer'

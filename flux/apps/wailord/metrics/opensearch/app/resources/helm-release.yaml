apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensearch
spec:
  interval: 1h
  chart:
    spec:
      chart: opensearch
      version:  3.7.0
      sourceRef:
        kind: HelmRepository
        name: opensearch-repo
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    clusterName: "wailord-opensearch"

  opensearch.yml: |
    cluster.name: wailord-opensearch

    # Bind to all interfaces because we don't know what IP address Docker will assign to us.
    network.host: 0.0.0.0
    

  envFrom:
    - secretRef:
        name: opensearch-envs

  persistence:
    size: 64Gi
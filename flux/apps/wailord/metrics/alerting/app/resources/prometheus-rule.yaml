apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wailord-alerts
  namespace: metrics
  labels:
    app.kubernetes.io/name: alerting
spec:
  groups:
    - name: zfs.pool.health
      rules:
        - alert: ZfsPoolUnhealthy
          # zfs_pool_health is 0 only when the pool is ONLINE.
          # Any other value (1=DEGRADED, 2=FAULTED, 3=OFFLINE,
          # 4=UNAVAIL, 5=REMOVED, 6=SUSPENDED, -1=unknown) is not healthy.
          expr: zfs_pool_health != 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.pool }} is not healthy"
            description: >-
              Pool {{ $labels.pool }} health status code is {{ $value }}
              (0 = ONLINE). Investigate with `zpool status {{ $labels.pool }}`.
            runbook_url: "https://openzfs.github.io/openzfs-docs/"

    - name: node.health
      rules:
        - alert: NodeOffline
          # Fires once per node if it is not Ready in Kubernetes OR not ready/offline
          # in Longhorn. The three conditions are ORed on the `node` label so a node
          # that is down in both systems only produces a single alert.
          expr: >-
            (max by (node) (kube_node_status_condition{condition="Ready",status="true"}) == 0)
            or on(node)
            (max by (node) (longhorn_node_status{condition="ready"}) == 0)
            or on(node)
            (max by (node) (up{job="longhorn-backend"} * on(pod) group_left(node) kube_pod_info{pod=~"longhorn-manager.*"}) == 0)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is offline"
            description: >-
              Node {{ $labels.node }} is not Ready in Kubernetes and/or not ready in Longhorn.
              Check `kubectl get node {{ $labels.node }}` and the Longhorn UI.

    - name: postgres.health
      rules:
        - alert: PostgresClusterUnhealthy
          # Fires for any CloudNativePG instance pod that is not Ready.
          expr: kube_pod_status_ready{condition="true"} == 0 and on(pod, namespace) kube_pod_info{created_by_kind="Cluster", created_by_name=~".*-pg-cluster"}
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Postgres instance {{ $labels.pod }} is not ready"
            description: >-
              CloudNativePG instance pod {{ $labels.pod }} in namespace {{ $labels.namespace }}
              is not Ready. Check the cluster status with `kubectl -n {{ $labels.namespace }} get cluster`.

    - name: prometheus.storage
      rules:
        - alert: PrometheusSizeRetentionActive
          # Prometheus deleted blocks because it hit retentionSize, i.e. we are
          # keeping less than the 30d time-based retention.
          expr: increase(prometheus_tsdb_size_retentions_total[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Prometheus is dropping data due to the size cap"
            description: >-
              {{ $labels.pod }} deleted blocks because it hit retentionSize before the
              30d time limit. Currently retaining
              {{ with printf "(time() - prometheus_tsdb_lowest_timestamp_seconds{pod='%s'}) / 86400" $labels.pod | query }}{{ . | first | value | printf "%.1f" }}{{ end }}
              days. Consider growing the PVC and retentionSize.

        - alert: PrometheusNotCompacting
          # The in-memory head block normally spans ~2-3h. If it grows far beyond
          # that, Prometheus is not persisting blocks to disk (this is what
          # silently filled the PVC in Nov 2026).
          expr: (prometheus_tsdb_head_max_time - prometheus_tsdb_head_min_time) / 1000 > 6 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Prometheus is not compacting its head block"
            description: >-
              {{ $labels.pod }} head block spans {{ $value | humanizeDuration }}.
              Blocks are not being written to disk; WAL and memory will grow until
              the PVC fills or the pod OOMs.

        - alert: PrometheusStorageNearlyFull
          expr: >-
            kubelet_volume_stats_available_bytes{persistentvolumeclaim=~"prometheus-.*"}
            / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"prometheus-.*"} < 0.10
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus PVC is over 90% full"
            description: >-
              PVC {{ $labels.persistentvolumeclaim }} has only
              {{ $value | humanizePercentage }} free.

    - name: gateway.health
      rules:
        - alert: GatewayRouteUnhealthy
          expr: probe_success{job="blackbox-gateway-routes"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Gateway route {{ $labels.instance }} is unhealthy"
            description: >-
              Blackbox HTTP probe failed for {{ $labels.instance }}.
              Check the route, backend, and gateway."
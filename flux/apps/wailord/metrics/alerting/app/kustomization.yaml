apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: blackbox-exporter-values
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled

resources:
  - resources/prometheus-rule.yaml
  - resources/alertmanager-config.yaml
  - resources/discord-webhook-secret.yaml
  - resources/helm-release.yaml
  - resources/oci-repo.yaml
  - resources/gateway-probe.yaml

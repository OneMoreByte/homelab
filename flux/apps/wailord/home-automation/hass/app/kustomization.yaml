apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: hass-values
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled

resources:
  - resources/helm-release.yaml
  - resources/oci-repo.yaml
  - resources/cluster-backup-creds.yaml
  - resources/postgres-db-secret.yaml
  - resources/postgres.yaml
  - resources/certificate.yaml
